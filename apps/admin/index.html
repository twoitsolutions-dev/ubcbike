<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>UBC Commerce Hub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <!-- Classic (non-module) script: reports load errors instead of leaving a blank page. -->
  <script src="js/boot-check.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot" id="boot">
      <div class="boot-mark" aria-hidden="true">UBC</div>
      <p>Loading UBC Commerce Hub…</p>
    </div>
  </div>
  <noscript>
    <div class="boot boot-error"><p>UBC Commerce Hub needs JavaScript enabled.</p></div>
  </noscript>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
