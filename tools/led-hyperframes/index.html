<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UBC LED Sign — 214x112 HyperFrames</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 214px;
      height: 112px;
      overflow: hidden;
      background: #000000;
      font-family: "Arial Black", "Segoe UI", Arial, sans-serif;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }
    #main {
      position: relative;
      width: 214px;
      height: 112px;
      background: #000000;
      overflow: hidden;
    }
    .clip {
      position: absolute;
      inset: 0;
      width: 214px;
      height: 112px;
      background: #000000;
      overflow: hidden;
    }

    /* Animated perimeter neon frame */
    .led-frame {
      position: absolute;
      inset: 1px;
      border: 2px solid #38BDF8;
      pointer-events: none;
      z-index: 10;
    }
    .led-frame.red { border-color: #FF1E1E; }
    .led-frame.cyan { border-color: #00E5FF; }

    /* Subtle moving neon light streaks on pure black */
    .speed-line {
      position: absolute;
      height: 2px;
      width: 64px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.45), transparent);
      animation: streak 2.2s linear infinite;
    }
    .speed-line.r {
      background: linear-gradient(90deg, transparent, rgba(255, 30, 30, 0.45), transparent);
      animation-duration: 1.8s;
      animation-delay: -0.7s;
    }
    @keyframes streak {
      from { transform: translateX(-80px); }
      to { transform: translateX(240px); }
    }

    /* Top header row */
    .top-bar {
      position: absolute;
      top: 5px;
      left: 6px;
      right: 6px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      border-bottom: 2px solid #FF1E1E;
    }
    .top-bar.cyan { border-bottom-color: #00E5FF; }
    .top-bar.blue { border-bottom-color: #38BDF8; }
    .ubc-logo {
      height: 16px;
      width: auto;
      display: block;
    }
    .pill-tag {
      background: #B91C1C;
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .pill-tag.cyan { background: #00E5FF; color: #000000; }

    /* Center bold headlines */
    .center {
      position: absolute;
      top: 29px;
      bottom: 24px;
      left: 6px;
      right: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.02;
    }
    .h-white {
      font-size: 21px;
      font-weight: 900;
      color: #FFFFFF;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .h-accent {
      font-size: 20px;
      font-weight: 900;
      color: #38BDF8;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-top: 2px;
      animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }
    .h-accent.red { color: #FF1E1E; }
    .h-accent.cyan { color: #00E5FF; }
    .h-accent.yellow { color: #FFE600; }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Bottom contact bar */
    .foot-bar {
      position: absolute;
      bottom: 5px;
      left: 6px;
      right: 6px;
      height: 19px;
      background: #0B1320;
      border: 1.5px solid #38BDF8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .foot-bar.red { border-color: #FF1E1E; }
    .foot-bar.cyan { border-color: #00E5FF; }

    /* Animated spinning bike wheel */
    .wheel-spin {
      width: 17px;
      height: 17px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Pulsing lightning bolt */
    .bolt-pulse {
      width: 15px;
      height: 17px;
      animation: pulse 0.9s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(0.92); opacity: 0.85; }
      to { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div
    id="main"
    data-composition-id="ubc-led-sign"
    data-start="0"
    data-duration="15"
    data-width="214"
    data-height="112"
    data-no-timeline
  >
    <!-- Slide 1 (0s - 5s): UBC Logo + Walk-In Service Center -->
    <section id="scene-1" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div class="led-frame"></div>
      <div class="speed-line" data-layout-allow-overflow style="top:34px;"></div>
      <div class="speed-line r" data-layout-allow-overflow style="top:80px;"></div>
      <div class="top-bar">
        <img class="ubc-logo" src="./assets/ubc-logo-white.png" alt="UBC">
        <svg class="wheel-spin" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9.5" stroke="#38BDF8" stroke-width="2.4"/>
          <line x1="12" y1="2.5" x2="12" y2="21.5" stroke="#FFFFFF" stroke-width="1.4"/>
          <line x1="2.5" y1="12" x2="21.5" y2="12" stroke="#FFFFFF" stroke-width="1.4"/>
          <line x1="5.3" y1="5.3" x2="18.7" y2="18.7" stroke="#FFFFFF" stroke-width="1.4"/>
          <line x1="18.7" y1="5.3" x2="5.3" y2="18.7" stroke="#FFFFFF" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="2.5" fill="#FF1E1E"/>
        </svg>
      </div>
      <div class="center">
        <div class="h-white">WALK-IN</div>
        <div class="h-accent">SERVICE CENTER</div>
      </div>
      <div class="foot-bar">(813) 971-2277 &middot; UBCBIKE.COM</div>
    </section>

    <!-- Slide 2 (5s - 10s): E-Bikes & 0% APR -->
    <section id="scene-2" class="clip" data-start="5" data-duration="5" data-track-index="1">
      <div class="led-frame cyan"></div>
      <div class="speed-line" data-layout-allow-overflow style="top:36px;"></div>
      <div class="top-bar cyan">
        <span class="pill-tag cyan">IN STOCK TODAY</span>
        <svg class="bolt-pulse" viewBox="0 0 24 24">
          <polygon points="13,2 4,14 11,14 9,22 20,10 13,10" fill="#FFE600" stroke="#FFFFFF" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="center">
        <div class="h-white">BIKES &amp; E-BIKES</div>
        <div class="h-accent cyan">0% APR FINANCING</div>
      </div>
      <div class="foot-bar cyan">TEST RIDE &middot; UBCBIKE.COM</div>
    </section>

    <!-- Slide 3 (10s - 15s): USF, Veterans & Police Discounts -->
    <section id="scene-3" class="clip" data-start="10" data-duration="5" data-track-index="1">
      <div class="led-frame red"></div>
      <div class="speed-line r" data-layout-allow-overflow style="top:38px;"></div>
      <div class="speed-line" data-layout-allow-overflow style="top:76px;"></div>
      <div class="top-bar blue">
        <img class="ubc-logo" src="./assets/ubc-logo-white.png" alt="UBC">
        <span class="pill-tag">SINCE 1972</span>
      </div>
      <div class="center">
        <div class="h-white">USF &middot; VETERANS</div>
        <div class="h-accent red">&amp; POLICE DISCOUNTS</div>
      </div>
      <div class="foot-bar red">(813) 971-2277 &middot; UBCBIKE.COM</div>
    </section>
  </div>
</body>
</html>
