services:
  postgres:
    image: postgres:16-alpine
    container_name: ubc-commerce-hub-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ubc
      POSTGRES_PASSWORD: ubc
      POSTGRES_DB: ubc_commerce_hub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ubc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubc -d ubc_commerce_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ubc_pg_data:
